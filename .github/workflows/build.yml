name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "ndk;26.3.11579264" "cmake;3.31.6"

      - name: Checkout XboxXBERecomp SDK
        uses: actions/checkout@v4
        with:
          repository: WINDROID-EMU/XboxXBERecomp
          path: sdk

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION ($TAG)..."

      - name: Configure Keystore (Optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "YUGIOH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "YUGIOH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "YUGIOH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "YUGIOH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No custom keystore configured. Building with standard debug signature for instant testing."
          fi

      - name: Build APK with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --stacktrace

      - name: Prepare APK and Checksums
        id: prepare_apk
        shell: bash
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Could not find compiled APK output!"
            exit 1
          fi

          APK_NAME="Yu-Gi-Oh-The-Dawn-of-Destiny-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_path=$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "APK ready: $APK_NAME ($(stat -c%s "$APK_NAME" | awk '{printf "%.2f MB", $1/1048576}'))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.sha_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Yu-Gi-Oh! The Dawn of Destiny Android ${{ steps.version.outputs.tag }}"
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.sha_path }}
          body: |
            ## Yu-Gi-Oh! The Dawn of Destiny (Android Port)
            **Version:** `${{ steps.version.outputs.tag }}`
            **Build Run:** `${{ github.run_number }}`
            **Architecture:** `arm64-v8a`
            
            ### SHA256 Checksum
            ```
            $(cat ${{ steps.prepare_apk.outputs.sha_path }})
            ```

            ### Instalação e Requisitos
            - **Android:** 10.0+ (API 29+)
            - **Arquitetura:** `arm64-v8a`
            - **Vulkan:** Suporte a Vulkan 1.1+
            - Baixe o arquivo APK anexado nesta release e instale no seu dispositivo.
            - Copie a pasta do jogo original ou a imagem `.iso` (Xbox original) para a pasta `YuGiOh` na raiz do seu armazenamento interno.
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
